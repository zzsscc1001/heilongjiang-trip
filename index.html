<title>黑龙江十一包车行程</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  :root {
    --ink: #1c1917;
    --muted: #57534e;
    --line: #e7e0d6;
    --paper: #f7f4ef;
    --card: #fffcf8;
    --stay: #7c3a2d;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", "Source Han Sans SC", sans-serif;
    color: var(--ink);
    background: var(--paper);
  }
  .app { display: flex; height: 100%; min-height: 100vh; }
  .panel {
    width: 380px;
    flex: none;
    background: var(--card);
    border-right: 1px solid var(--line);
    overflow: auto;
    z-index: 500;
    box-shadow: 8px 0 32px rgba(40, 30, 20, .04);
  }
  .head {
    position: sticky;
    top: 0;
    background: rgba(255,252,248,.94);
    backdrop-filter: blur(8px);
    padding: 20px 20px 14px;
    border-bottom: 1px solid var(--line);
    z-index: 2;
  }
  .eyebrow {
    font-size: 12px;
    letter-spacing: .12em;
    color: var(--muted);
  }
  h1 {
    font-size: 22px;
    line-height: 1.3;
    margin: 6px 0 4px;
    font-weight: 700;
  }
  .sub { margin: 0; color: var(--muted); font-size: 13px; }
  .total {
    margin-top: 10px;
    font-size: 13px;
    color: var(--ink);
  }
  .total b { font-weight: 700; }
  .days { padding: 8px 12px 24px; }
  .day {
    margin: 12px 8px;
    padding: 4px 4px 8px;
    background: #faf7f2;
    border-radius: 16px;
  }
  .day-h {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    background: transparent;
    border: 0;
    padding: 8px;
    border-radius: 10px;
    cursor: pointer;
    text-align: left;
    font: inherit;
    color: inherit;
  }
  .day-h:hover, .day-h:focus-visible { background: #f3eee6; outline: none; }
  .swatch { width: 10px; height: 28px; border-radius: 99px; flex: none; }
  .day-h .t { font-weight: 700; font-size: 14px; }
  .day-h .m { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .stop {
    width: calc(100% - 8px);
    margin: 0 4px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    background: transparent;
    border: 0;
    border-radius: 10px;
    padding: 8px 8px;
    cursor: pointer;
    text-align: left;
    font: inherit;
    color: inherit;
  }
  .stop:hover, .stop:focus-visible { background: #f6f1ea; outline: none; }
  .stop.on { position: relative; z-index: 2; background: #fff; box-shadow: inset 0 0 0 2px currentColor; }
  .num {
    width: 26px; height: 26px; border-radius: 50%;
    color: white; font-size: 12px; font-weight: 700;
    display: grid; place-items: center; flex: none; margin-top: 1px;
  }
  .stop.stay .num { border-radius: 7px; box-shadow: 0 0 0 2px white, 0 0 0 4px currentColor; }
  .stop .nm { font-size: 14px; font-weight: 600; }
  .stop .meta { font-size: 12px; color: var(--muted); margin-top: 2px; line-height: 1.45; }
  .tag {
    display: inline-block;
    font-size: 11px;
    padding: 0 6px;
    border-radius: 99px;
    background: #f1ebe3;
    color: #44403c;
    margin-left: 6px;
    font-weight: 600;
    vertical-align: 1px;
  }
  .tag.stay { background: #f6e4dc; color: var(--stay); }
  .legend {
    margin: 4px 12px 20px;
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: 12px;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.55;
  }
  .legend strong { color: var(--ink); font-weight: 650; }
  .legend .row { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .sq { width: 12px; height: 12px; border-radius: 3px; box-shadow: 0 0 0 2px #fff, 0 0 0 3px #7c3a2d; background: #7c3a2d; }
  #map { flex: 1; min-width: 0; background: #e7e1d6; }
  .map-title {
    position: absolute;
    z-index: 450;
    left: 12px;
    top: 12px;
    background: rgba(255,252,248,.94);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 8px 12px;
    box-shadow: 0 8px 24px rgba(40,30,20,.08);
    pointer-events: none;
  }
  .map-title b { display: block; font-size: 14px; }
  .map-title span { font-size: 12px; color: var(--muted); }
  .leaflet-popup-content { margin: 10px 12px; }
  .pop .k { font-size: 11px; letter-spacing: .08em; color: #78716c; }
  .pop h3 { margin: 2px 0 6px; font-size: 16px; }
  .pop p { margin: 0; font-size: 13px; line-height: 1.45; color: #44403c; }
  .leaflet-container { font-family: inherit; }
  .leaflet-bar {
    border: 0 !important;
    border-radius: 14px !important;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(40, 30, 20, .12);
  }
  .leaflet-bar a { width: 36px !important; height: 36px !important; line-height: 36px !important; }
  .sheet-bar { display: none; }
  @media (max-width: 720px) {
    html, body { height: 100%; overflow: hidden; }
    .app { display: block; position: relative; height: 100dvh; min-height: 100dvh; }
    #map { position: absolute; inset: 0; min-height: 0; }
    .panel {
      position: absolute;
      left: 8px; right: 8px; bottom: 8px;
      width: auto;
      max-height: min(74dvh, 580px);
      border: 0;
      border-radius: 24px;
      box-shadow: 0 12px 40px rgba(40, 30, 20, .18);
      padding-bottom: env(safe-area-inset-bottom);
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      background: rgba(255, 252, 248, .96);
      backdrop-filter: blur(16px);
    }
    .panel.collapsed {
      max-height: none;
      height: auto;
      overflow: hidden;
    }
    .panel { display: flex; flex-direction: column; overflow: hidden; }
    .sheet-body { display: none; }
    .panel:not(.collapsed) { height: min(74dvh, 580px); }
    .panel:not(.collapsed) .sheet-body {
      display: block;
      flex: 1;
      min-height: 0;
      overflow: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
    }
    .sheet-body .head { display: none; position: static; }
    .sheet-bar {
      display: block;
      position: relative;
      flex: none;
      z-index: 3;
      background: transparent;
      padding: 0 4px 14px;
    }
    .grip {
      display: block;
      width: 100%;
      height: 22px;
      border: 0;
      background: transparent;
      padding: 0;
      cursor: pointer;
    }
    .grip i {
      display: block;
      width: 36px;
      height: 4px;
      margin: 8px auto 0;
      border-radius: 99px;
      background: #d6cfc4;
    }
    .peek-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      padding: 0 12px 10px;
    }
    .peek-title { font-size: 18px; font-weight: 750; letter-spacing: -.02em; line-height: 1.2; }
    .peek-km { text-align: right; line-height: 1; }
    .peek-km b { font-size: 22px; font-weight: 750; letter-spacing: -.03em; }
    .peek-km span { display: block; margin-top: 3px; font-size: 11px; color: var(--muted); }
    .chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 12px 12px;
      scrollbar-width: none;
    }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      flex: none;
      border: 0;
      border-radius: 14px;
      padding: 8px 12px 8px 10px;
      min-height: 44px;
      background: #f3eee6;
      color: var(--ink);
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    .chip .dt { display: block; font-size: 11px; color: var(--muted); font-weight: 650; }
    .chip .nm { display: block; font-size: 13px; font-weight: 750; margin-top: 1px; }
    .chip i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }
    .chip.on { position: relative; z-index: 2; background: #fff; box-shadow: inset 0 0 0 2px currentColor; }
    .peek-route {
      margin: 0 12px;
      padding: 10px 12px;
      border-radius: 14px;
      background: #f6f1ea;
      color: #44403c;
      font-size: 13px;
      line-height: 1.5;
      min-height: 3em;
    }
    .head { padding: 4px 16px 12px; }
    h1 { font-size: 18px; }
    .day { margin: 10px; background: #fff; }
    .day-h, .stop { min-height: 44px; }
    .map-title { display: none; }
    .leaflet-popup-content-wrapper { border-radius: 14px; max-width: min(280px, calc(100vw - 40px)); }
    .leaflet-bottom { margin-bottom: calc(228px + env(safe-area-inset-bottom)); }
    .leaflet-control-attribution { font-size: 9px; max-width: 42vw; background: rgba(255,252,248,.85); }
    body.sheet-open .leaflet-bottom { display: none; }
  }
</style>
</head>

<script>
const TRIP = {"colors":{"1":"#d86b3a","2":"#1f8a84","3":"#3e7c4a","4":"#b5812f","5":"#3d6ea5"},"days":[{"id":1,"date":"10.2","name":"火山矿泉","color":"#d86b3a","km":363,"items":[1,2,3,4,5,6]},{"id":2,"date":"10.3","name":"湿地与溪水","color":"#1f8a84","km":457,"items":[7,8,9]},{"id":3,"date":"10.4","name":"五营红松","color":"#3e7c4a","km":179,"items":[10,11]},{"id":4,"date":"10.5","name":"林海奇石","color":"#b5812f","km":128,"items":[12,{"ref":9,"label":"伊春","extra":"返回住宿 · 与 10.3 同一点"}]},{"id":5,"date":"10.6","name":"乌带公路进哈","color":"#3d6ea5","km":575,"items":[13,14,15]}],"stops":[{"n":1,"name":"齐齐哈尔","day":1,"kind":"start","lodging":false,"lat":47.3392424,"lon":123.9495373,"zoom":12,"popup":"出发 · 市区（龙沙）","blurb":"出发地，取市区而非地级市边界中心。","source":"https://www.openstreetmap.org/node/244081515","note":"OSM place=city 齐齐哈尔市（node 244081515，龙沙区）。未用地级市关系中心 47.74N,124.66E。"},{"n":2,"name":"五大连池","day":1,"kind":"spot","lodging":false,"lat":48.6865367,"lon":126.1038315,"zoom":13,"popup":"景区 · 老黑山门口（世界地质公园新期火山区），不是市区住宿","blurb":"老黑山景区入口，在药泉和市区北面。","source":"https://www.openstreetmap.org/node/5668294223","note":"OSM tourism=attraction「老黑山门口」。行程里的「五大连池」取地质公园新期火山景区入口，与后面的温泊、北饮泉、龙门石寨以及市区住宿分开。"},{"n":3,"name":"温泊","day":1,"kind":"spot","lodging":false,"lat":48.6524077,"lon":126.157019,"zoom":15,"popup":"景区 · 药泉一带的温泊","blurb":"五大连池镇青泉村，药泉矿泉区。","source":"https://www.openstreetmap.org/node/5668239021","note":"OSM tourism=attraction「温泊景区」，五大连池镇青泉村。未采用攻略站未注明来源的 48.689,126.182。"},{"n":4,"name":"北饮泉","day":1,"kind":"spot","lodging":false,"lat":48.6524027,"lon":126.1476594,"zoom":15,"popup":"景区 · 饮用矿泉","blurb":"药泉湖附近的北饮泉。","source":"https://www.openstreetmap.org/node/4330971002","note":"OSM natural=spring「北饮泉」，在温泊西侧约 700 米，同属药泉景区。"},{"n":5,"name":"龙门石寨","day":1,"kind":"spot","lodging":false,"lat":48.690971,"lon":126.3222384,"zoom":14,"popup":"景区 · 地质公园东部熔岩台地","blurb":"五大连池镇东部。","source":"https://www.openstreetmap.org/node/10203490400","note":"OSM tourism=attraction「龙门石寨」，位于药泉区以东，与「景区东部」的记述一致。"},{"n":6,"name" const map = L.map("map", { zoomControl: true, scrollWheelZoom: true, zoomSnap: 0.25 });
const osm = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "&copy; OpenStreetMap contributors",
  maxZoom: 19
});
osm.addTo(map);
L.control.scale({ imperial: false, position: "bottomleft" }).addTo(map);


const byId = {};
TRIP.stops.forEach(s => { byId[s.n] = s; });
const markers = {};
const dayLines = {};
const bounds = [];

function pinIcon(s, active) {
  const color = TRIP.colors[s.day];
  const size = active ? 34 : 28;
  const radius = s.kind === "stay" ? "8px" : (s.kind === "road" ? "4px" : "50%");
  const ring = s.kind === "stay" ? "box-shadow:0 0 0 2px #fff,0 0 0 4px " + color + ";" : "box-shadow:0 1px 4px rgba(0,0,0,.28);";
  return L.divIcon({
    className: "pin",
    iconSize: [size, size],
    iconAnchor: [size / 2, size / 2],
    popupAnchor: [0, -size / 2],
    html: '<div style="width:' + size + 'px;height:' + size + 'px;border-radius:' + radius + ';background:' + color + ';' + ring + 'color:#fff;font-weight:700;font-size:12px;display:grid;place-items:center;border:2px solid #fff;">' + s.n + '</div>'
  });
}

const kindLabel = { start: "出发", spot: "景区", stay: "住宿", road: "道路廊道", end: "终点" };

TRIP.stops.forEach(s => {
  const m = L.marker([s.lat, s.lon], { icon: pinIcon(s, false), zIndexOffset: s.kind === "stay" ? 400 : 300 });
  const day = TRIP.days.find(d => d.id === s.day);
  const stayLine = s.lodging ? "<p>住宿</p>" : "<p>" + kindLabel[s.kind] + "</p>";
  m.bindPopup(
    '<div class="pop"><div class="k">第 ' + s.day + ' 天 · ' + day.date + '</div><h3>' + s.name + '</h3>' +
    stayLine + '<p>' + s.popup + '</p></div>'
  );
  m.on("click", () => selectStop(s.n, false));
  m.addTo(map);
  markers[s.n] = m;
  bounds.push([s.lat, s.lon]);
});

Object.keys(TRIP.routes).forEach(id => {
  const r = TRIP.routes[id];
  const line = L.polyline(r.coords, {
    color: TRIP.colors[id],
    weight: 5,
    opacity: 0.92,
    lineJoin: "round",
    lineCap: "round"
  }).addTo(map);
  dayLines[id] = line;
  r.coords.forEach(c => bounds.push(c));
});

const wudaiLine = L.polyline(TRIP.wudai.coords, {
  color: "#ffffff",
  weight: 10,
  opacity: 0.95,
  lineJoin: "round",
  lineCap: "round"
}).addTo(map);
L.polyline(TRIP.wudai.coords, {
  color: TRIP.colors[5],
  weight: 5,
  opacity: 1,
  lineJoin: "round",
  lineCap: "round"
}).addTo(map);

// endpoint ticks for the corridor, not extra numbered attractions
TRIP.stops.find(s => s.kind === "road").endpoints.forEach(ep => {
  L.circleMarker([ep.lat, ep.lon], {
    radius: 5, color: TRIP.colors[5], weight: 2, fillColor: "#fff", fillOpacity: 1
  }).addTo(map).bindTooltip(ep.role + " · " + ep.name, { permanent: false, direction: "right" });
});

function isPhone() {
  return window.matchMedia("(max-width: 720px)").matches;
}
function sheetLift() {
  if (!isPhone()) return 0;
  const panel = document.getElementById("panel");
  return panel.classList.contains("collapsed") ? 96 : Math.min(window.innerHeight * 0.28, 180);
}
function flyPoint(latlng, zoom) {
  const lift = sheetLift();
  if (!lift) {
    map.flyTo(latlng, zoom, { duration: 0.7 });
    return;
  }
  const pt = map.project(latlng, zoom).add([0, lift]);
  map.flyTo(map.unproject(pt, zoom), zoom, { duration: 0.7 });
}
function dayPad() {
  if (!isPhone()) return { padding: [28, 28] };
  const lift = document.getElementById("panel").classList.contains("collapsed") ? 210 : 280;
  return { paddingTopLeft: [18, 18], paddingBottomRight: [18, lift] };
}

function stopLabel(item) {
  const ref = typeof item === "number" ? item : item.ref;
  const s = byId[ref];
  return { s, label: typeof item === "number" ? s.name : item.label };
}
function showPeek(dayId) {
  const el = document.getElementById("peekRoute");
  if (!el) return;
  if (!dayId) {
    el.textContent = TRIP.days.map(d => d.date + " " + d.name).join(" · ");
    return;
  }
  const d = TRIP.days.find(x => String(x.id) === String(dayId));
  const bits = d.items.map(stopLabel);
  const stay = bits.find(b => b.s.lodging);
  const tail = stay ? "住" + stay.label : "到" + bits[bits.length - 1].label;
  el.textContent = bits.map(b => b.label).join(" → ") + " · 约 " + d.km + " km · " + tail;
}

function selectStop(n, fly) {
  const s = byId[n];
  document.querySelectorAll(".stop").forEach(el => el.classList.toggle("on", Number(el.dataset.id) === n));
  document.querySelectorAll(".chip").forEach(el => el.classList.toggle("on", el.dataset.day === String(s.day)));
  showPeek(s.day);
  Object.keys(markers).forEach(id => markers[id].setIcon(pinIcon(byId[id], Number(id) === n)));
  Object.keys(dayLines).forEach(id => {
    dayLines[id].setStyle({ opacity: String(s.day) === id ? 0.95 : 0.28, weight: String(s.day) === id ? 6 : 4 });
  });
  if (isPhone()) setSheet(true);
  if (fly !== false) {
    if (s.kind === "road") {
      map.flyToBounds(wudaiLine.getBounds().pad(0.15), Object.assign({ duration: 0.7, maxZoom: 10 }, dayPad()));
    } else {
      flyPoint([s.lat, s.lon], s.zoom || 13);
    }
  }
  markers[n].openPopup();
  const btn = document.querySelector('.stop[data-id="' + n + '"]');
  if (btn && !isPhone()) btn.scrollIntoView({ block: "nearest" });
}

function selectDay(id) {
  document.querySelectorAll(".stop").forEach(el => el.classList.remove("on"));
  document.querySelectorAll(".chip").forEach(el => el.classList.toggle("on", el.dataset.day === String(id)));
  showPeek(id);
  Object.keys(markers).forEach(n => markers[n].setIcon(pinIcon(byId[n], false)));
  Object.keys(dayLines).forEach(k => {
    dayLines[k].setStyle({ opacity: String(id) === k ? 0.95 : 0.25, weight: String(id) === k ? 6 : 4 });
  });
  if (isPhone()) setSheet(true);
  map.flyToBounds(dayLines[id].getBounds(), Object.assign({ duration: 0.7 }, dayPad()));
}

function panel() {
  const root = document.getElementById("panel");
  const daysHtml = TRIP.days.map(d => {
    const items = d.items.map(item => {
      const ref = typeof item === "number" ? item : item.ref;
      const s = byId[ref];
      const label = typeof item === "number" ? s.name : item.label;
      const extra = typeof item === "number" ? s.blurb : item.extra;
      const stay = s.lodging;
      const tag = stay ? '<span class="tag stay">住宿</span>' : (s.kind === "road" ? '<span class="tag">廊道</span>' : "");
      return '<button class="stop' + (stay ? " stay" : "") + '" data-id="' + ref + '" style="color:' + d.color + '">' +
        '<span class="num" style="background:' + TRIP.colors[s.day] + '">' + s.n + '</span>' +
        '<span><span class="nm">' + label + tag + '</span><div class="meta">' + extra + '</div></span></button>';
    }).join("");
    return '<section class="day"><button class="day-h" data-day="' + d.id + '">' +
      '<i class="swatch" style="background:' + d.color + '"></i>' +
      '<span><span class="t">第 ' + d.id + ' 天 · ' + d.date + ' · ' + d.name + '</span>' +
      '<div class="m">路线约 ' + d.km + ' km</div></span></button>' + items + '</section>';
  }).join("");
  root.innerHTML =
    '<div class="sheet-body"><div class="head"><div class="eyebrow">2026 · 10.2–10.6</div>' +
    '<h1>黑龙江十一包车行程</h1>' +
    '<p class="sub">包车，非自驾</p>' +
    '<div class="total">全程路线约 <b>' + TRIP.totalKm + '</b> km<span style="color:#78716c"> · OSRM 驾车，五日合计后四舍五入</span></div></div>' +
    '<div class="days">' + daysHtml + '</div>' +
    '<div class="legend"><strong>图例</strong>' +
    '<div class="row"><i class="dot" style="background:#d86b3a"></i><i class="dot" style="background:#1f8a84"></i><i class="dot" style="background:#3e7c4a"></i><i class="dot" style="background:#b5812f"></i><i class="dot" style="background:#3d6ea5"></i><span>五日驾车路线，全部沿路，没有用直线代替</span></div>' +
    '<div class="row"><i class="sq"></i><span>双圈方标是住宿。同一城镇不重复打点</span></div>' +
    '<div class="row"><span style="width:18px;border-top:3px solid #3d6ea5;display:inline-block"></span><span>乌带公路是乌马河镇到带岭镇的道路廊道，路线约 ' + TRIP.wudai.km + ' km</span></div>' +
    '</div></div>';
  const chips = TRIP.days.map(d =>
    '<button type="button" class="chip" data-day="' + d.id + '" style="color:' + d.color + '">' +
    '<span class="dt"><i style="background:' + d.color + '"></i>' + d.date + '</span>' +
    '<span class="nm">' + d.name + '</span></button>'
  ).join("");
  root.insertAdjacentHTML("afterbegin",
    '<div class="sheet-bar"><button type="button" class="grip" id="sheetToggle" aria-label="展开或收起行程"><i></i></button>' +
    '<div class="peek-head"><div><div class="eyebrow">2026 · 包车</div><div class="peek-title">黑龙江十一</div></div>' +
    '<div class="peek-km"><b>' + TRIP.totalKm + '</b><span>公里</span></div></div>' +
    '<div class="chips">' + chips + '</div>' +
    '<p class="peek-route" id="peekRoute"></p></div>');
  showPeek(null);
  root.querySelectorAll(".stop").forEach(btn => btn.addEventListener("click", () => selectStop(Number(btn.dataset.id))));
  root.querySelectorAll(".day-h").forEach(btn => btn.addEventListener("click", () => selectDay(btn.dataset.day)));
  root.querySelectorAll(".chip").forEach(btn => btn.addEventListener("click", (e) => {
    e.stopPropagation();
    selectDay(btn.dataset.day);
  }));
  document.getElementById("sheetToggle").addEventListener("click", () => setSheet(!root.classList.contains("collapsed")));
}
function setSheet(collapsed) {
  const root = document.getElementById("panel");
  if (!isPhone()) {
    root.classList.remove("collapsed");
    document.body.classList.remove("sheet-open");
    return;
  }
  root.classList.toggle("collapsed", collapsed);
  document.body.classList.toggle("sheet-open", !collapsed);
  const grip = document.getElementById("sheetToggle");
  if (grip) grip.setAttribute("aria-expanded", collapsed ? "false" : "true");
  setTimeout(() => map.invalidateSize(), 60);
}
panel();
setSheet(true);
map.fitBounds(bounds, isPhone() ? { paddingTopLeft: [18, 18], paddingBottomRight: [18, 210] } : { padding: [28, 28] });
window.addEventListener("resize", () => setSheet(document.getElementById("panel").classList.contains("collapsed")));
</script>
</body>
</html>
